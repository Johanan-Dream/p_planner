kind = "web"
previewPath = "/"
title = "피플랜"
description = "팀 14의 오사카 P형 여행 플래너. 무계획력 기반 일정과 Google 지도, 출처를 구분한 관광지 정보 확인을 제공하는 Preview 전용 시제품."
version = "1.0.0"
id = "artifacts/osaka-ilttan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19941

[services.development]
run = "pnpm --filter @workspace/osaka-ilttan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/osaka-ilttan", "run", "build" ]
serve = "static"
publicDir = "artifacts/osaka-ilttan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19941"
BASE_PATH = "/"
