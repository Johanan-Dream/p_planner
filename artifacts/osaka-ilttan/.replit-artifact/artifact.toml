kind = "web"
previewPath = "/"
title = "일단, 오사카"
description = "팀 14의 한국어 모바일 우선 오사카 여행 일정 초안 만들기. 여행 날짜, 무계획력과 필수 장소를 반영하고 브라우저에 입력을 저장하는 프리뷰 전용 시제품."
version = "1.0.0"
id = "artifacts/osaka-ilttan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19941

[services.development]
run = "pnpm --filter @workspace/osaka-ilttan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/osaka-ilttan", "run", "build" ]
serve = "static"
publicDir = "artifacts/osaka-ilttan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19941"
BASE_PATH = "/"
